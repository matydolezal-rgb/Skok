<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Skok</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-512.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <!-- ukazatel výšky -->
  <div id="hud" class="hud hidden">
    <div id="hud-mode" class="hud-mode">denní výzva</div>
    <div class="meters"><span id="m-num">0</span><span class="m-unit">m</span></div>
  </div>

  <!-- MENU -->
  <div id="ui-menu" class="overlay">
    <h1 class="logo">SKOK</h1>
    <p class="sub">Voda stoupá. Nahoru, nebo nic.</p>

    <div class="menu">
      <button id="btn-daily" class="card card-main">
        <span class="card-title">Denní výzva</span>
        <span class="card-note" id="daily-note">jeden pokus denně</span>
      </button>

      <button id="btn-free" class="card">
        <span class="card-title">Volný let</span>
        <span class="card-note" id="free-note">trénuj, kolikrát chceš</span>
      </button>

      <button id="btn-board" class="card card-slim">
        <span class="card-title">Žebříček</span>
        <span class="card-note">výsledky a kamarádi</span>
      </button>
    </div>

    <div class="toggles">
      <button id="btn-sound" class="sound-toggle">🔊 Zvuky</button>
      <button id="btn-music" class="sound-toggle">🎵 Hudba</button>
    </div>
  </div>

  <!-- ŽEBŘÍČEK -->
  <div id="ui-board" class="overlay overlay-top hidden">
    <h2 class="board-title">Žebříček</h2>

    <div class="tabs">
      <button id="tab-me" class="tab tab-on">Moje výzvy</button>
      <button id="tab-friends" class="tab">Kamarádi</button>
    </div>

    <div id="board-list" class="board-list"></div>
    <div id="board-empty" class="board-empty hidden"></div>

    <button id="btn-board-back" class="btn btn-ghost">Zpět</button>
  </div>

  <!-- KONEC BĚHU -->
  <div id="ui-over" class="overlay hidden">
    <div class="over-cause" id="over-cause">Voda tě dostihla</div>
    <div class="over-score"><span id="over-num">0</span><span class="m-unit">m</span></div>
    <div class="over-best" id="over-best"></div>
    <button id="btn-retry" class="btn">Znovu</button>
    <button id="btn-menu" class="btn btn-ghost">Menu</button>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/rng.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>
  /* Offline režim — na file:// se registrace neprovádí, tam není potřeba.
     Když se na pozadí stáhne novější verze hry, stránka se sama načte znovu,
     ať uživatel nemusí aplikaci zavírat a otevírat. Uprostřed běhu ne — to by
     ho to připravilo o rozehrané kolo, tam se s tím počká na další spuštění. */
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    var uzSeNacita = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (uzSeNacita || window.__skokHraje) return;
      uzSeNacita = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
