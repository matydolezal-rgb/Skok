<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Skok</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-512.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <!-- ukazatel výšky -->
  <div id="hud" class="hud hidden">
    <div class="meters"><span id="m-num">0</span><span class="m-unit">m</span></div>
  </div>

  <!-- úvod -->
  <div id="ui-title" class="overlay">
    <h1 class="logo">SKOK</h1>
    <p class="sub">Voda stoupá. Nahoru, nebo nic.</p>
    <button id="btn-play" class="btn">Skočit</button>
    <div class="hint">
      <span>Klepni kamkoliv — odrazíš se na druhou stěnu.</span>
      <span class="hint-dim">Pozor na trny a padající kameny.</span>
    </div>
    <div class="best-line">Nejvýš: <b id="best-title">0 m</b></div>
  </div>

  <!-- konec -->
  <div id="ui-over" class="overlay hidden">
    <div class="over-cause" id="over-cause">Voda tě dostihla</div>
    <div class="over-score"><span id="over-num">0</span><span class="m-unit">m</span></div>
    <div class="over-best" id="over-best"></div>
    <button id="btn-retry" class="btn">Znovu</button>
    <button id="btn-menu" class="btn btn-ghost">Zpět</button>
  </div>
</div>

<script src="js/rng.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>
  /* offline režim — na file:// se registrace neprovádí, tam není potřeba */
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
