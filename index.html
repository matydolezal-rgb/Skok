<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>No Way But Up</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-512.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <!-- height readout -->
  <div id="hud" class="hud hidden">
    <div id="hud-mode" class="hud-mode">daily challenge</div>
    <div class="meters"><span id="m-num">0</span><span class="m-unit">m</span></div>
    <div class="hud-gems"><span class="gem-ico">◆</span><span id="gem-num">0</span></div>
  </div>

  <button id="btn-pause" class="pause-btn hidden" aria-label="Pause">॥</button>

  <!-- PAUSE -->
  <div id="ui-pause" class="overlay hidden">
    <h2 class="pause-title">Paused</h2>
    <div class="pause-score"><span id="pause-num">0</span><span class="m-unit">m</span></div>
    <button id="btn-resume" class="btn">Resume</button>
    <button id="btn-quit" class="btn btn-ghost">Quit run and back to menu</button>
    <div class="pause-note">A run you quit doesn't count.</div>
  </div>

  <!-- MENU -->
  <div id="ui-menu" class="overlay">
    <h1 class="logo">No Way<br>But Up</h1>
    <p class="sub">The water is rising.</p>

    <button id="btn-krystaly" class="gift-btn" aria-label="Get Crystals">🎁</button>

    <div class="menu">
      <button id="btn-daily" class="card card-main">
        <span class="card-title">Daily Challenge</span>
        <span class="card-note" id="daily-note">today's ravine — the same for everyone</span>
      </button>

      <button id="btn-free" class="card">
        <span class="card-title">Free Climb</span>
        <span class="card-note" id="free-note">practise as much as you like</span>
      </button>

      <button id="btn-board" class="card card-slim">
        <span class="card-title">Leaderboard</span>
        <span class="card-note">scores and friends</span>
      </button>

      <button id="btn-shop" class="card card-slim">
        <span class="card-title">Shop</span>
        <span class="card-note" id="shop-note">skins &amp; trails</span>
      </button>
    </div>

    <div class="gem-bank"><span class="gem-ico">◆</span><span id="gem-total">0</span><span class="gem-label">crystals to spend</span></div>

    <div class="toggles">
      <button id="btn-sound" class="sound-toggle">🔊 Sound</button>
      <button id="btn-music" class="sound-toggle">🎵 Music</button>
      <button id="btn-haptic" class="sound-toggle hidden">📳 Vibration</button>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div id="ui-board" class="overlay overlay-top hidden">
    <h2 class="board-title">Leaderboard</h2>
    <div class="board-sub" id="board-sub">today's ravine</div>

    <div class="tabs">
      <button id="tab-world" class="tab tab-on">World</button>
      <button id="tab-friends" class="tab">Friends</button>
      <button id="tab-me" class="tab">Mine</button>
    </div>

    <div id="board-panel" class="board-panel hidden"></div>
    <div id="board-list" class="board-list"></div>
    <div id="board-empty" class="board-empty hidden"></div>

    <button id="btn-board-back" class="btn btn-ghost">Back</button>
  </div>

  <!-- SHOP -->
  <div id="ui-shop" class="overlay overlay-top hidden">
    <h2 class="board-title">Shop</h2>
    <div class="board-sub"><span class="gem-ico">◆</span><span id="shop-balance">0</span> to spend</div>

    <div class="tabs">
      <button id="shop-tab-skiny" class="tab tab-on">Character</button>
      <button id="shop-tab-stopy" class="tab">Trails</button>
      <button id="shop-tab-mapy" class="tab">Maps</button>
      <button id="shop-tab-splash" class="tab">Splash</button>
    </div>

    <div id="shop-grid" class="shop-grid"></div>

    <button id="btn-shop-back" class="btn btn-ghost">Back</button>
  </div>

  <!-- KRYSTALY -->
  <div id="ui-krystaly" class="overlay overlay-top hidden">
    <h2 class="board-title">Get Crystals</h2>
    <div class="board-sub"><span class="gem-ico">◆</span><span id="krystaly-balance">0</span> to spend</div>

    <div id="krystaly-grid" class="shop-grid"></div>

    <button id="btn-krystaly-back" class="btn btn-ghost">Back</button>
  </div>

  <!-- ZOOM NA SKIN -->
  <div id="skin-zoom" class="skin-zoom hidden">
    <canvas id="skin-zoom-canvas" width="320" height="320"></canvas>
    <div class="skin-zoom-name" id="skin-zoom-name"></div>
    <div class="skin-zoom-hint">tap anywhere to close</div>
  </div>

  <!-- END OF RUN -->
  <div id="ui-over" class="overlay hidden">
    <div class="over-cause" id="over-cause">The water caught you</div>
    <div class="over-score" id="over-score">
      <span id="over-num">0</span><span class="m-unit">m</span>
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
      <span class="spark s5"></span><span class="spark s6"></span><span class="spark s7"></span><span class="spark s8"></span>
    </div>
    <div class="over-gems" id="over-gems"></div>
    <div class="over-best" id="over-best"></div>
    <button id="btn-retry" class="btn">Again</button>
    <button id="btn-menu" class="btn btn-ghost">Menu</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sit.js"></script>
<script src="js/mena.js"></script>
<script src="js/krystaly.js"></script>
<script src="js/skins.js"></script>
<script src="js/trails.js"></script>
<script src="js/mapy.js"></script>
<script src="js/splash.js"></script>
<script src="js/audio.js"></script>
<script src="js/haptika.js"></script>
<script src="js/rng.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>
  /* Offline režim — na file:// se registrace neprovádí, tam není potřeba.
     Když se na pozadí stáhne novější verze hry, stránka se sama načte znovu,
     ať uživatel nemusí aplikaci zavírat a otevírat. Uprostřed běhu ne — to by
     ho to připravilo o rozehrané kolo, tam se s tím počká na další spuštění. */
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    var uzSeNacita = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (uzSeNacita || window.__skokHraje) return;
      uzSeNacita = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
