<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>body{margin:0;background:#000;display:flex;gap:10px}canvas,iframe{width:400px;height:850px;border:0}</style>
</head><body>
<iframe id="menu" src="../index.html"></iframe>
<canvas id="c2" width="400" height="850"></canvas>
<canvas id="c3" width="400" height="850"></canvas>
<script src="../js/rng.js"></script>
<script src="../js/world.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script>
var STEP = 1/120, W = 400, H = 850;

function predictLanding(){
  var p = Game.player, side = p.side;
  var x = p.x, y = p.y, vx = -side * P.JUMP_VX, vy = P.JUMP_VY, dt = STEP;
  for (var i = 0; i < 400; i++){
    vy += P.GRAVITY*dt; x += vx*dt; y += vy*dt;
    if (side < 0 ? (x + P.R >= World.rightWall(y)) : (x - P.R <= World.leftWall(y))) return { y:y, side:-side };
  }
  return null;
}

/* vyšplhá do zadané výšky; voda je po dobu přípravy vypnutá, ať se tam robot dostane */
function vyskej(metry, seed){
  Game.reset(W, H, seed);
  var puvodni = Game.waterSpeed;
  Game.waterSpeed = function(){ return 0; };
  for (var i = 0; i < 120*400 && Game.height < metry && !Game.over; i++){
    var p = Game.player;
    if (p.state === 'cling' && p.stun <= 0){
      var land = predictLanding();
      if (!(land && World.spikeAt(land.y, land.side))) Game.jump();
    }
    Game.update(STEP);
  }
  Game.waterSpeed = puvodni;
}

vyskej(150, 'led-1');
Render.draw(document.getElementById('c2').getContext('2d'), Game, 120);

vyskej(190, 'led-2');
/* nasypeme rampouchy, ať je na snímku vidět, jak vypadají */
for (var k = 0; k < 4; k++) Game.spawnRock();
Game.rocks.forEach(function(r, i){ r.typ = 'rampouch'; r.dl = 34 + i*6; r.r = 8 + i; r.y = Game.camY + 120 + i*150; });
Game.waterY = Game.player.y + 420;
Game.update(STEP);
Render.draw(document.getElementById('c3').getContext('2d'), Game, 120);

document.title = 'hotovo';
</script>
</body></html>
