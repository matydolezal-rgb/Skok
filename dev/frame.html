<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>body{margin:0;background:#000;display:flex;gap:10px}canvas{width:400px;height:850px}</style>
</head><body>
<canvas id="c1" width="400" height="850"></canvas>
<canvas id="c2" width="400" height="850"></canvas>
<canvas id="c3" width="400" height="850"></canvas>
<script src="../js/rng.js"></script>
<script src="../js/world.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script>
var STEP = 1/120, W = 400, H = 850;

function predictLanding(){
  var p = Game.player, side = p.side;
  var x = p.x, y = p.y, vx = -side * P.JUMP_VX, vy = P.JUMP_VY, dt = STEP;
  for (var i = 0; i < 400; i++){
    vy += P.GRAVITY*dt; x += vx*dt; y += vy*dt;
    if (side < 0 ? (x + P.R >= World.rightWall(y)) : (x - P.R <= World.leftWall(y))) return { y:y, side:-side };
  }
  return null;
}

function vyskej(metry, seed){
  Game.reset(W, H, seed);
  var puvodni = Game.waterSpeed;
  Game.waterSpeed = function(){ return 0; };
  for (var i = 0; i < 120*600 && Game.height < metry && !Game.over; i++){
    var p = Game.player;
    if (p.state === 'cling' && p.stun <= 0){
      var land = predictLanding();
      if (!(land && World.spikeAt(land.y, land.side))) Game.jump();
    }
    Game.update(STEP);
  }
  Game.waterSpeed = puvodni;
}

/* 1 — ledová část */
vyskej(150, 'ukazka-led');
Render.draw(document.getElementById('c1').getContext('2d'), Game, 120);

/* 2 — sněžná část se sněhovými koulemi */
vyskej(235, 'ukazka-snih');
Game.rocks.length = 0;
for (var k = 0; k < 3; k++){ Game.spawnRock(); }
Game.rocks.forEach(function(r, i){
  r.typ = 'koule'; r.r = 17 + i * 3;
  r.y = Game.camY + 140 + i * 230;
  r.x = World.leftWall(r.y) + (World.rightWall(r.y) - World.leftWall(r.y)) * (0.3 + i * 0.2);
});
Game.update(STEP);
Render.draw(document.getElementById('c2').getContext('2d'), Game, 120);

/* 3 — vstup do sněžné části: nápis a voda v zádech */
vyskej(205, 'ukazka-snih2');
Game.zonaText = 'SNÍH'; Game.zonaCas = 1.6;
Game.waterY = Game.player.y + 430;
Game.update(STEP);
Render.draw(document.getElementById('c3').getContext('2d'), Game, 120);

document.title = 'hotovo';
</script>
</body></html>
