<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>body{margin:0;background:#000;display:flex;gap:10px}canvas{width:400px;height:850px}</style>
</head><body>
<canvas id="c1" width="400" height="850"></canvas>
<canvas id="c2" width="400" height="850"></canvas>
<canvas id="c3" width="400" height="850"></canvas>
<script src="../js/rng.js"></script>
<script src="../js/world.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script>
var STEP = 1/120, W = 400, H = 850;

function predictLanding(){
  var p = Game.player, side = p.side;
  var x = p.x, y = p.y, vx = -side * P.JUMP_VX, vy = P.JUMP_VY, dt = STEP;
  for (var i = 0; i < 400; i++){
    vy += P.GRAVITY*dt; x += vx*dt; y += vy*dt;
    if (side < 0 ? (x + P.R >= World.rightWall(y)) : (x - P.R <= World.leftWall(y))) return { y:y, side:-side };
  }
  return null;
}

function vyskej(metry, seed){
  Game.reset(W, H, seed);
  var puvodni = Game.waterSpeed;
  Game.waterSpeed = function(){ return 0; };
  for (var i = 0; i < 120*600 && Game.height < metry && !Game.over; i++){
    var p = Game.player;
    if (p.state === 'cling' && p.stun <= 0){
      var land = predictLanding();
      if (!(land && World.spikeAt(land.y, land.side))) Game.jump();
    }
    Game.update(STEP);
  }
  Game.waterSpeed = puvodni;
}

/* hledá výhled, kde jsou zrovna vidět trny — jinak by snímek nic neukázal */
function najdiTrny(odMetru, doMetru, seed){
  for (var m = odMetru; m < doMetru; m += 8){
    vyskej(m, seed);
    var cam = Game.camY;
    for (var b = Math.floor(cam/World.BAND); b <= Math.floor((cam+H)/World.BAND); b++){
      if (World.spikeBand(b, -1) || World.spikeBand(b, 1)) return true;
    }
  }
  return false;
}

najdiTrny(20, 60, 'trny-kamen');
Render.draw(document.getElementById('c1').getContext('2d'), Game, 0);

najdiTrny(85, 135, 'trny-led');
Render.draw(document.getElementById('c2').getContext('2d'), Game, 70);

najdiTrny(155, 210, 'trny-snih');
Render.draw(document.getElementById('c3').getContext('2d'), Game, 70);

document.title = 'hotovo';
</script>
</body></html>
