<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>uitest</title></head><body>
<pre id="out">běží…</pre>
<iframe id="f" src="../index.html" width="420" height="820"></iframe>
<script>
var L = [], f = document.getElementById('f');

f.onload = function(){
  var d = f.contentDocument, w = f.contentWindow;
  var errors = [];
  w.onerror = function(m){ errors.push(m); };

  function vis(id){ return !d.getElementById(id).classList.contains('hidden'); }

  try {
    L.push('plátno má rozměr: ' + (d.getElementById('cv').width > 0));
    L.push('úvod vidět: ' + vis('ui-title') + ', ukazatel skrytý: ' + !vis('hud'));

    d.getElementById('btn-play').click();
    L.push('po startu — ukazatel: ' + vis('hud') + ', úvod skrytý: ' + !vis('ui-title'));

    /* klepání do plátna nesmí nic shodit */
    var cv = d.getElementById('cv');
    for (var i = 0; i < 30; i++) cv.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles:true }));
    L.push('30 klepnutí přežilo: ' + (errors.length === 0));

    /* mezerník na úvodní obrazovce taky spouští hru */
    d.getElementById('btn-menu').click();
    L.push('tlačítko Zpět vrací na úvod: ' + vis('ui-title'));
    w.dispatchEvent(new w.KeyboardEvent('keydown', { code:'Space' }));
    L.push('mezerník spustil hru: ' + vis('hud'));

    L.push('rekord se ukládá: ' + (w.localStorage.getItem('skok.best') !== undefined));
    L.push('chyby: ' + (errors.length ? errors.join(' | ') : 'žádné'));
  } catch(e){
    L.push('VÝJIMKA: ' + e.message);
  }
  document.getElementById('out').textContent = L.join('\n');
};
</script>
</body></html>
