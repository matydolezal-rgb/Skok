<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>uitest</title></head><body>
<pre id="out">běží…</pre>
<iframe id="f" src="../index.html" width="420" height="820"></iframe>
<script>
var L = [], f = document.getElementById('f');

f.onload = function(){
  var d = f.contentDocument, w = f.contentWindow;
  var errors = [];
  w.onerror = function(m){ errors.push(m); };
  function vis(id){ return !d.getElementById(id).classList.contains('hidden'); }
  function txt(id){ return d.getElementById(id).textContent.trim(); }

  try {
    try { w.localStorage.clear(); } catch(e){}

    L.push('menu vidět: ' + vis('ui-menu') + ', ukazatel skrytý: ' + !vis('hud'));
    L.push('popisek denní výzvy: "' + txt('daily-note') + '"');
    L.push('popisek volného letu: "' + txt('free-note') + '"');

    /* žebříček prázdný */
    d.getElementById('btn-board').click();
    L.push('žebříček se otevřel: ' + vis('ui-board') + ', prázdná hláška: ' + vis('board-empty'));
    d.getElementById('tab-world').click();
    L.push('záložka svět bez serveru vysvětluje stav: ' + (txt('board-empty').indexOf('zapojený') > -1));
    d.getElementById('tab-friends').click();
    L.push('záložka kamarádi bez serveru vysvětluje stav: ' + (txt('board-empty').indexOf('zapojený') > -1));
    d.getElementById('tab-me').click();
    L.push('záložka moje funguje i bez serveru: ' + (txt('board-empty').indexOf('denní výzva') > -1));
    d.getElementById('btn-board-back').click();
    L.push('zpět v menu: ' + vis('ui-menu'));

    /* volný let */
    d.getElementById('btn-free').click();
    L.push('volný let běží: ' + vis('hud') + ', štítek: "' + txt('hud-mode') + '"');
    var cv = d.getElementById('cv');
    for (var i = 0; i < 20; i++) cv.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles:true }));

    d.getElementById('btn-menu').click();
    L.push('z běhu zpět do menu: ' + vis('ui-menu'));

    /* denní výzva */
    d.getElementById('btn-daily').click();
    L.push('denní výzva běží: ' + vis('hud') + ', štítek: "' + txt('hud-mode') + '"');

    /* ručně dopíšeme výsledek dne a ověříme, že se menu i žebříček změní */
    var dnes = w.todaySeed();
    w.localStorage.setItem('skok.daily.' + dnes, '77');
    d.getElementById('btn-menu').click();
    L.push('menu ví o hotové výzvě: ' + (txt('daily-note').indexOf('77') > -1));

    /* denní výzva musí jít hrát opakovaně */
    d.getElementById('btn-daily').click();
    L.push('druhý pokus se rozjede: ' + vis('hud') + ' (ne žebříček: ' + !vis('ui-board') + ')');
    d.getElementById('btn-menu').click();

    d.getElementById('btn-board').click();
    d.getElementById('tab-me').click();
    L.push('v seznamu je dnešek: ' + (d.querySelectorAll('#board-list .row').length === 1));
    L.push('skóre v řádku: ' + (d.querySelector('.row-score') || {}).textContent);

    /* přepínače zvuku a hudby */
    d.getElementById('btn-board-back').click();
    var pred = txt('btn-music');
    d.getElementById('btn-music').click();
    var po = txt('btn-music');
    L.push('hudba se přepíná: ' + (pred !== po) + ' (' + pred + ' → ' + po + ')');
    d.getElementById('btn-music').click();
    d.getElementById('btn-sound').click();
    L.push('zvuk se přepíná: ' + (txt('btn-sound').indexOf('🔇') > -1));
    d.getElementById('btn-sound').click();

    /* běh se zapnutou hudbou */
    d.getElementById('btn-free').click();
    for (var j = 0; j < 10; j++) d.getElementById('cv').dispatchEvent(new w.PointerEvent('pointerdown', { bubbles:true }));
    d.getElementById('btn-menu').click();
    L.push('běh s hudbou proběhl bez chyby: ' + (errors.length === 0));

    L.push('chyby: ' + (errors.length ? errors.join(' | ') : 'žádné'));
  } catch(e){
    L.push('VÝJIMKA: ' + e.message + ' | ' + (e.stack||'').split('\n')[1]);
  }
  document.getElementById('out').textContent = L.join('\n');
};
</script>
</body></html>
