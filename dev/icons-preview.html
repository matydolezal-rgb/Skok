<script>
Skiny.SEZNAM.forEach(function(s){
  var wrap = document.createElement('div'); wrap.className = 'c';
  var cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
  Render.previewSkin(cv.getContext('2d'), 128, 128, s.id);
  var lbl = document.createElement('span'); lbl.textContent = s.jmeno;
  wrap.appendChild(cv); wrap.appendChild(lbl);
  document.body.appendChild(wrap);
});
</script>
