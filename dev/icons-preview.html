<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>icons</title>
<style>
  body{ background:#05070c; margin:0; padding:20px; }
  h2{ color:#eaf2ff; font:700 16px sans-serif; margin:0 0 10px; }
  .row{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:24px; }
  .c{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  canvas{ background:#111a27; border-radius:12px; }
  span{ color:#eaf2ff; font:14px sans-serif; }
</style>
</head><body>
<script src="../js/config.js"></script>
<script src="../js/sit.js"></script>
<script src="../js/mena.js"></script>
<script src="../js/skins.js"></script>
<script src="../js/trails.js"></script>
<script src="../js/mapy.js"></script>
<script src="../js/rng.js"></script>
<script src="../js/world.js"></script>
<script src="../js/game.js"></script>
<script src="../js/render.js"></script>
<script>
function galerie(nadpis, seznam, kresli){
  var h = document.createElement('h2'); h.textContent = nadpis;
  document.body.appendChild(h);
  var row = document.createElement('div'); row.className = 'row';
  seznam.forEach(function(s){
    var wrap = document.createElement('div'); wrap.className = 'c';
    var cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
    kresli(cv.getContext('2d'), s.id);
    var lbl = document.createElement('span'); lbl.textContent = s.jmeno;
    wrap.appendChild(cv); wrap.appendChild(lbl);
    row.appendChild(wrap);
  });
  document.body.appendChild(row);
}
galerie('Character', Skiny.SEZNAM, function(ctx, id){ Render.previewSkin(ctx, 128, 128, id); });
galerie('Trails', Stopy.SEZNAM, function(ctx, id){ Render.previewTrail(ctx, 128, 128, id); });
galerie('Maps', Mapy.SEZNAM, function(ctx, id){ Render.previewMapa(ctx, 128, 128, id, 2.4); });
</script>
</body></html>
