<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
var S = window.innerWidth;                 // ikona je vždy čtverec podle okna
var c = document.getElementById('c');
c.width = S; c.height = S;
var x = c.getContext('2d');
var u = S / 512;                           // vše kreslíme v měřítku 512

/* pozadí */
var bg = x.createLinearGradient(0, 0, 0, S);
bg.addColorStop(0, '#1b2a44');
bg.addColorStop(1, '#070b14');
x.fillStyle = bg; x.fillRect(0, 0, S, S);

/* stěny rokliny */
function wall(side){
  x.beginPath();
  var edge = side < 0 ? 0 : S;
  x.moveTo(edge, 0);
  for (var y = 0; y <= S; y += 16 * u){
    var d = (0.20 + 0.055 * Math.sin(y / u * 0.020 + (side < 0 ? 0 : 2.4))
                  + 0.030 * Math.sin(y / u * 0.007 + 1.1)) * S;
    x.lineTo(side < 0 ? d : S - d, y);
  }
  x.lineTo(edge, S);
  x.closePath();
  var g = x.createLinearGradient(side < 0 ? 0 : S, 0, S / 2, 0);
  g.addColorStop(0, '#2a3346');
  g.addColorStop(1, '#4d5a79');
  x.fillStyle = g; x.fill();
  x.strokeStyle = 'rgba(215,235,255,.85)'; x.lineWidth = 5 * u; x.stroke();
}
wall(-1); wall(1);

/* voda dole */
var w = x.createLinearGradient(0, S * 0.80, 0, S);
w.addColorStop(0, 'rgba(80,190,220,.95)');
w.addColorStop(1, 'rgba(10,60,95,.95)');
x.fillStyle = w;
x.beginPath();
x.moveTo(0, S);
for (var i = 0; i <= S; i += 8 * u) x.lineTo(i, S * 0.84 + Math.sin(i / u * 0.03) * 8 * u);
x.lineTo(S, S); x.closePath(); x.fill();

/* postava v letu */
var px = S * 0.50, py = S * 0.46, r = 46 * u;
x.strokeStyle = '#e0748a'; x.lineWidth = 13 * u; x.lineCap = 'round';
x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + 42*u, py + 40*u, px + 92*u, py + 62*u); x.stroke();

x.beginPath(); x.ellipse(px, py + 4*u, r * 0.80, r * 0.95, 0, 0, 6.283);
x.fillStyle = '#f6f1e6'; x.fill();
x.strokeStyle = 'rgba(20,26,38,.7)'; x.lineWidth = 6 * u; x.stroke();

/* ruce vzhůru — bez nich to vypadá jako zvíře, ne jako lezec */
x.strokeStyle = '#f6f1e6'; x.lineWidth = 15 * u;
x.beginPath();
x.moveTo(px - 14*u, py - 8*u); x.lineTo(px - 52*u, py - 58*u);
x.moveTo(px + 14*u, py - 8*u); x.lineTo(px + 44*u, py - 66*u);
x.stroke();

x.beginPath(); x.arc(px - 6*u, py - r * 0.82, r * 0.42, 0, 6.283);
x.fillStyle = '#fffaf0'; x.fill();
x.strokeStyle = 'rgba(20,26,38,.7)'; x.lineWidth = 6 * u; x.stroke();

x.strokeStyle = '#3b4457'; x.lineWidth = 11 * u;
x.beginPath();
x.moveTo(px - 11*u, py + r * 0.78); x.lineTo(px - 20*u, py + r * 1.30);
x.moveTo(px + 11*u, py + r * 0.78); x.lineTo(px + 22*u, py + r * 1.26);
x.stroke();
</script>
</body></html>
