<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
/* Generátor ikon pro všechny platformy. Kresba je stejná jako v dev/icon.html,
   jen rozdělená do funkcí, aby šla vykreslit i po částech.

   Režim se předává v adrese (?m=…):
     full      celá scéna — iOS, web i starší android mipmapy. Barva sahá
               do rohů (systém ořezává až pětinu z každé strany a průhledný
               okraj by vypadal jako světlý lem) a postava je zvětšená, aby
               byla poznat i na ploše telefonu. "maskable" je totéž — pro
               obojí vyhovuje stejná kompozice, tak se needituje dvakrát.
     bg        jen roklina a voda bez postavy — pozadí adaptivní ikony
     fg        jen postava, zvětšená do bezpečné zóny — popředí adaptivní ikony

   Velikost = velikost okna, takže se generuje přes headless Chrome
   s --window-size a --screenshot. */

var S = window.innerWidth;
var c = document.getElementById('c');
c.width = S; c.height = S;
var x = c.getContext('2d');

var rezim = (location.search.match(/m=(\w+)/) || [])[1] || 'full';

function scena(kresliPostavu, kresliPozadi){
  var u = S / 512;
  x.save();
  var W = S;

  if (kresliPozadi){
    var bg = x.createLinearGradient(0, 0, 0, W);
    bg.addColorStop(0, '#1b2a44');
    bg.addColorStop(1, '#070b14');
    x.fillStyle = bg; x.fillRect(0, 0, W, W);

    /* stěny rokliny */
    function wall(side){
      x.beginPath();
      var edge = side < 0 ? 0 : W;
      x.moveTo(edge, 0);
      for (var y = 0; y <= W; y += 16 * u){
        var d = (0.20 + 0.055 * Math.sin(y / u * 0.020 + (side < 0 ? 0 : 2.4))
                      + 0.030 * Math.sin(y / u * 0.007 + 1.1)) * W;
        x.lineTo(side < 0 ? d : W - d, y);
      }
      x.lineTo(edge, W);
      x.closePath();
      var g = x.createLinearGradient(side < 0 ? 0 : W, 0, W / 2, 0);
      g.addColorStop(0, '#2a3346');
      g.addColorStop(1, '#4d5a79');
      x.fillStyle = g; x.fill();
      x.strokeStyle = 'rgba(215,235,255,.85)'; x.lineWidth = 5 * u; x.stroke();
    }
    wall(-1); wall(1);

    /* voda dole */
    var w = x.createLinearGradient(0, W * 0.80, 0, W);
    w.addColorStop(0, 'rgba(80,190,220,.95)');
    w.addColorStop(1, 'rgba(10,60,95,.95)');
    x.fillStyle = w;
    x.beginPath();
    x.moveTo(0, W);
    for (var i = 0; i <= W; i += 8 * u) x.lineTo(i, W * 0.84 + Math.sin(i / u * 0.03) * 8 * u);
    x.lineTo(W, W); x.closePath(); x.fill();
  }

  if (kresliPostavu) postava(W, u);
  x.restore();
}

/* Postava v letu. Kreslí se vždy vůči předanému plátnu, ať jde použít
   i samostatně jako popředí adaptivní ikony. */
function postava(W, u){
  var px = W * 0.50, py = W * 0.46, r = 46 * u;

  x.strokeStyle = '#e0748a'; x.lineWidth = 13 * u; x.lineCap = 'round';
  x.beginPath(); x.moveTo(px, py);
  x.quadraticCurveTo(px + 42*u, py + 40*u, px + 92*u, py + 62*u); x.stroke();

  x.beginPath(); x.ellipse(px, py + 4*u, r * 0.80, r * 0.95, 0, 0, 6.283);
  x.fillStyle = '#f6f1e6'; x.fill();
  x.strokeStyle = 'rgba(20,26,38,.7)'; x.lineWidth = 6 * u; x.stroke();

  /* ruce vzhůru — bez nich to vypadá jako zvíře, ne jako lezec */
  x.strokeStyle = '#f6f1e6'; x.lineWidth = 15 * u;
  x.beginPath();
  x.moveTo(px - 14*u, py - 8*u); x.lineTo(px - 52*u, py - 58*u);
  x.moveTo(px + 14*u, py - 8*u); x.lineTo(px + 44*u, py - 66*u);
  x.stroke();

  x.beginPath(); x.arc(px - 6*u, py - r * 0.82, r * 0.42, 0, 6.283);
  x.fillStyle = '#fffaf0'; x.fill();
  x.strokeStyle = 'rgba(20,26,38,.7)'; x.lineWidth = 6 * u; x.stroke();

  x.strokeStyle = '#3b4457'; x.lineWidth = 11 * u;
  x.beginPath();
  x.moveTo(px - 11*u, py + r * 0.78); x.lineTo(px - 20*u, py + r * 1.30);
  x.moveTo(px + 11*u, py + r * 0.78); x.lineTo(px + 22*u, py + r * 1.26);
  x.stroke();
}

if (rezim === 'full' || rezim === 'maskable'){
  /* Jedna kompozice pro web i iOS: pozadí až do rohů (po oříznutí do kolečka
     nesmí nikde prosvítat plátno) a výrazně větší postava. Původní kresba
     měla postavu tak malou, že na ploše telefonu (kolem 60 px) z ikony zbyl
     jen tmavý čtvereček — ověřeno v dev/ikony-nahled.html. */
  scena(false, true);
  postava(S, S / 512 * 1.34);
} else if (rezim === 'fg'){
  /* Popředí adaptivní ikony: průhledné pozadí, postava zvětšená tak, aby byla
     na ploše telefonu poznat, ale nevylezla z bezpečné zóny (66 % plátna).
     Bez zvětšení by byla drobná — adaptivní ikona zobrazuje jen výsek.
     Svislý posun proto, že postava má ruce nahoře, takže její těžiště je
     níž než střed kresby a bez posunu by seděla vysoko. */
  x.save();
  x.translate(0, S * 0.045);
  postava(S, S / 512 * 1.55);
  x.restore();
} else if (rezim === 'bg'){
  scena(false, true);
} else {
  scena(true, true);
}
</script>
</body></html>
